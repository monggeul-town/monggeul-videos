# 클라우드 예약 게시 (몽글동네). 보관함의 .github/workflows/scheduled-publish.yml 로 올라간다.
# 2026-11-03 구조 변경 "이어달리기(릴레이)": GitHub 의 시계(cron)는 몇 시간씩 빠질 수 있어 cron 에 기대지 않는다.
#  - 예약 파일(schedules/)이 보관함에 저장되는 순간(push) 이 실행이 시작된다. 업무 사이트가 대표님 열쇠로 올리므로 새 실행이 확실히 생긴다.
#  - 시작한 실행은 앞으로 48시간 안의 예약이 있는 동안 끝내지 않고 기다리다가, 예약 시각(초 단위, 약 20초 전부터 시작)에 인스타 릴스 -> 스레드 순서로 올린다.
#  - GitHub 작업 한도(6시간) 전(약 5~5.5시간 지났을 때)에 자기 자신을 workflow_dispatch 로 다시 불러 바통을 넘기고 끝낸다. 남은 예약이 없으면 사슬이 멈춘다.
#  - cron(5분 간격)은 사슬이 끊겼을 때를 위한 예비다. 사슬이 살아 있으면 줄 서 있다가 취소되거나 이어받는다(문제 없음).
#  - 기다리는 동안에도 예약 파일을 1~2분마다 다시 읽어 취소·시간 변경·새 예약을 반영한다. 열쇠는 보관함 Secrets 에서만 읽고 로그에는 찍지 않는다.
# 실패·놓침이 있으면 이 실행을 빨간 X(실패)로 끝내 GitHub 메일이 가게 한다.
# 공개 보관함의 표준 GitHub 호스티드 러너는 사용 시간이 무료(기다리는 시간 포함).
name: scheduled-publish

on:
  push:
    branches: [main]
    paths:
      - 'schedules/**'
      - 'scripts/**'
      - '.github/workflows/scheduled-publish.yml'
  schedule:
    # 예비(사슬이 끊겼을 때). 정각(몰리는 시각)을 피해 2분, 7분, 12분... 에 실행. GitHub 는 바쁠 때 몇 시간씩 건너뛰기도 한다
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = 예약 확인(기본), check = 열쇠·계정 읽기 전용 점검, relay-test = 이어달리기(스스로 다시 부르기) 점검(아무것도 올리지 않음)'
        required: false
        default: 'run'
        type: choice
        options:
          - run
          - check
          - relay-test
      wait:
        description: '미리 와서 기다리기(직접 실행은 보통 꺼 둠. 켜면 이어달리기 사슬을 시작함 - 시각이 된 예약을 올리고 48시간 안의 예약을 기다림)'
        required: false
        default: false
        type: boolean

# 결과 파일(results/)을 보관함에 적고(contents), 스스로를 다시 부를 수 있게(actions) 기본 열쇠(GITHUB_TOKEN)에 권한을 준다
permissions:
  contents: write
  actions: write

# 기다리는 사슬(자동·push·예비·바통 넘기기)은 한 줄로 세운다 = 한 번에 한 실행만 올린다(중복 게시 방지). 줄 서는 실행은 최대 1개이고 새로 오면 앞의 대기를 대체한다(모두 같은 일을 하므로 문제 없음).
# 직접 실행(기다리기 끔)과 점검(check)·이어달리기 점검(relay-test)은 따로 돌아서, 기다리는 실행 때문에 막히지 않는다 (중복은 결과 파일의 waiting/running 표시와 저장 충돌로 막음)
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.wait != 'true' || github.event.inputs.mode != 'run')) && format('monggeul-cloud-manual-{0}', github.run_id) || 'monggeul-cloud-publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub 작업 최대 6시간(360분). 바통은 300~335분 사이에 넘기므로 350분이면 충분
    timeout-minutes: 350
    steps:
      - name: 예약 파일과 게시 코드만 가져오기 (영상은 필요할 때만 따로 받음)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            schedules
            scripts
      - name: 시각이 된 예약 올리기 (48시간 안의 예약은 기다림, 한도 전에 바통 넘김)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DO_WAIT: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.wait == 'true' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          if ($env:DO_WAIT -eq 'true' -and $env:RUN_MODE -eq 'run') { ./scripts/cloud-publish.ps1 -Mode $env:RUN_MODE -Wait }
          else { ./scripts/cloud-publish.ps1 -Mode $env:RUN_MODE }
          # 스크립트가 "확인 필요"로 끝나면(exit 1) 이 단계도 실패(빨간 X)로 -> GitHub 가 메일을 보낸다
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
