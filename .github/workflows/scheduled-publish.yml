# 클라우드 예약 게시 (몽글동네). 보관함의 .github/workflows/scheduled-publish.yml 로 올라간다.
# 5분마다 깨어나 "시각이 된 예약"(schedules/SCH-*.json, executor: cloud)이 있으면 인스타 릴스 -> 스레드 순서로 올리고
# 결과를 results/ 에 적는다. 열쇠는 보관함 Secrets 에서만 읽고 화면(로그)에는 찍지 않는다.
name: scheduled-publish

on:
  schedule:
    # 정각(몰리는 시각)을 피해 2분, 7분, 12분... 에 실행 (GitHub 는 바쁠 때 늦게 시작할 수 있음)
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = 예약 확인(기본), check = 열쇠·계정 읽기 전용 점검(아무것도 올리지 않음)'
        required: false
        default: 'run'
        type: choice
        options:
          - run
          - check

# 결과 파일(results/)을 보관함에 적을 수 있게 기본 열쇠(GITHUB_TOKEN)에 쓰기 권한을 준다
permissions:
  contents: write

# 동시에 두 번 실행되지 않게 한 줄로 세운다 (중복 게시 방지)
concurrency:
  group: monggeul-cloud-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 예약 파일과 게시 코드만 가져오기 (영상은 필요할 때만 따로 받음)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            schedules
            scripts
      - name: 시각이 된 예약 올리기
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: ./scripts/cloud-publish.ps1 -Mode '${{ github.event.inputs.mode || 'run' }}'
