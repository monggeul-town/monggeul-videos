# 클라우드 예약 게시 (몽글동네). 보관함의 .github/workflows/scheduled-publish.yml 로 올라간다.
# 약 5분 간격(실제로는 30~46분 간격으로 돌 때가 많음)으로 깨어나, 앞으로 3시간 안에 시각이 되는 예약(schedules/SCH-*.json, executor: cloud)이 있으면
# 끝내지 않고 "미리 와서 기다렸다가" 예약 시각(초 단위, 약 20초 전부터 시작)에 인스타 릴스 -> 스레드 순서로 올리고 결과를 results/ 에 적는다.
# 기다리는 동안에도 예약 파일을 1~2분마다 다시 읽어 취소·시간 변경을 반영한다. 열쇠는 보관함 Secrets 에서만 읽고 화면(로그)에는 찍지 않는다.
# 실패·놓침이 있으면 이 실행을 빨간 X(실패)로 끝내 GitHub 메일이 가게 한다.
name: scheduled-publish

on:
  schedule:
    # 정각(몰리는 시각)을 피해 2분, 7분, 12분... 에 실행 (GitHub 는 바쁠 때 늦게 시작할 수 있음)
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = 예약 확인(기본), check = 열쇠·계정 읽기 전용 점검(아무것도 올리지 않음)'
        required: false
        default: 'run'
        type: choice
        options:
          - run
          - check
      wait:
        description: '미리 와서 기다리기(보통 꺼 둠. 직접 실행하면 시각이 이미 된 예약만 올림)'
        required: false
        default: false
        type: boolean

# 결과 파일(results/)을 보관함에 적을 수 있게 기본 열쇠(GITHUB_TOKEN)에 쓰기 권한을 준다
permissions:
  contents: write

# 자동(5분 간격) 실행은 한 줄로 세운다 (중복 게시 방지). 기다리는 실행이 있으면 새 실행은 줄 서 있다가 이어받는다.
# 직접 실행(workflow_dispatch)은 따로 돌아서, 기다리는 실행 때문에 점검·긴급 실행이 막히지 않는다 (중복은 결과 파일의 waiting 표시와 저장 충돌로 막음)
concurrency:
  group: ${{ github.event_name == 'schedule' && 'monggeul-cloud-publish' || format('monggeul-cloud-manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 예약 파일과 게시 코드만 가져오기 (영상은 필요할 때만 따로 받음)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            schedules
            scripts
      - name: 시각이 된 예약 올리기 (3시간 안의 예약은 미리 와서 기다림)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DO_WAIT: ${{ github.event_name == 'schedule' || github.event.inputs.wait == 'true' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          if ($env:DO_WAIT -eq 'true' -and $env:RUN_MODE -eq 'run') { ./scripts/cloud-publish.ps1 -Mode $env:RUN_MODE -Wait }
          else { ./scripts/cloud-publish.ps1 -Mode $env:RUN_MODE }
          # 스크립트가 "확인 필요"로 끝나면(exit 1) 이 단계도 실패(빨간 X)로 -> GitHub 가 메일을 보낸다
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
